<!DOCTYPE html><html><head><meta charset="utf-8"><base href="../"><style>body{margin:0;background:#888}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/addons/" } }</script></head>
<body><canvas id="c" width="1200" height="600"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { makeCar } from './src/gfx/carmesh.js';
import { dummyShadowRT } from './src/gfx/materials.js';
import { makeEnvironment } from './src/gfx/env.js';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.setSize(1200, 600, false);
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
r.setRenderTarget(dummyShadowRT); r.clear(); r.setRenderTarget(null);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9aa4ae);
scene.environment = await makeEnvironment(r);
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(3, 5, 4); scene.add(sun);
const cam = new THREE.PerspectiveCamera(35, 2, 0.1, 100);
const mode = new URLSearchParams(location.search).get('m') || 'side';
const l = new GLTFLoader(); l.setMeshoptDecoder(MeshoptDecoder);
const g = await l.loadAsync('assets/car/goblin.glb');
const raw = g.scene; raw.updateMatrixWorld(true);
const bb = new THREE.Box3().setFromObject(raw); const sz = bb.getSize(new THREE.Vector3()); const ct = bb.getCenter(new THREE.Vector3());
const s = 4.4 / Math.max(sz.x, sz.z); raw.scale.setScalar(s); raw.position.sub(ct.multiplyScalar(s)); raw.position.x -= 3;
scene.add(raw);
const car = await makeCar({ color: 0xa3120e }); car.root.position.set(3, 0, 0); scene.add(car.root);
window.__info = { rawSize: sz.toArray(), s, rVis: car.rVis, wheels: Object.fromEntries(Object.entries(car.wheels).map(([k, w]) => [k, w.base.toArray().map((v) => +v.toFixed(3))])) };
const bb2 = new THREE.Box3().setFromObject(car.body); window.__info.body = [bb2.min.toArray().map((v) => +v.toFixed(2)), bb2.max.toArray().map((v) => +v.toFixed(2))];
if (mode === 'side') { cam.position.set(0, 1.2, 11); cam.lookAt(0, 0.3, 0); }
else if (mode === 'top') { cam.position.set(0, 13, 0.01); cam.lookAt(0, 0, 0); }
else { cam.position.set(0, 1.0, -12); cam.lookAt(0, 0.3, 0); }
r.render(scene, cam);
window.__done = true;
</script></body></html>
