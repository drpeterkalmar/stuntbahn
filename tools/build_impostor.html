<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Impostor-Bäcker (n30)</title>
<script type="importmap">{ "imports": { "three": "../lib/three.module.min.js", "three/addons/": "../lib/addons/" } }</script>
</head><body style="margin:0;background:#222">
<canvas id="c"></canvas>
<script type="module">
// Oktaeder-Impostors backen (n30). Gesteuert von tools/build_impostor.py: window.backeArt(name, N, zelle) →
// { farbe, normalen (PNG-dataURL), meta }. Modelle: tools/impostor_modelle.mjs, Bäcker: tools/build_impostor.mjs.
import * as THREE from 'three';
import { backe } from './build_impostor.mjs';
import { lade, ARTEN } from './impostor_modelle.mjs';
const canvas = document.getElementById('c');
const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true, premultipliedAlpha: false });
window.arten = () => Object.keys(ARTEN);
window.backeArt = async (name, N = 8, zelle = 128) => { const obj = await lade(name); const res = backe(r, obj, { N, zelle }); return res; };
window.ready = true;
</script></body></html>
